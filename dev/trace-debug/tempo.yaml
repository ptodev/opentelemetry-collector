# Minimal local Tempo config for dev/trace-debug.
#
# The whole point of this setup is to see traces Tempo's defaults would
# reject, so limits below are raised well past a normal production Tempo.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4319

ingester:
  trace_idle_period: 30s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

overrides:
  defaults:
    global:
      max_bytes_per_trace: 50000000 # 50 MB, well above the 5 MB pass-through floor
    ingestion:
      max_traces_per_user: 0 # unlimited (dev-only, single user)

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
